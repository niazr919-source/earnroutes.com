# Builds the static site and publishes it to the `deploy` branch.
#
# Hostinger's Git integration clones a branch straight into public_html and does
# not run a build, so the branch it pulls has to contain finished HTML. Source
# stays on `main`; `deploy` holds only the contents of out/.
name: Build and publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Submit every URL to IndexNow, not just changed pages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the changed-file diff below has a parent to compare to.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Both values are inlined into client-side JS, so they are repository
      # variables (Settings > Secrets and variables > Actions > Variables),
      # not secrets. An unset AdSense ID simply omits ads.txt and the ad tags.
      - run: npm run build
        env:
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}

      - name: Verify the export looks complete
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          test -f out/404.html   || { echo "::error::out/404.html missing"; exit 1; }
          test -f out/.htaccess  || { echo "::error::out/.htaccess missing"; exit 1; }
          test -f out/sitemap.xml || { echo "::error::out/sitemap.xml missing"; exit 1; }
          test -f out/llms.txt   || { echo "::error::out/llms.txt missing"; exit 1; }

      - name: Work out which URLs changed
        id: urls
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          echo "Changed files:"
          echo "$CHANGED"
          # One space-separated line: URLs never contain spaces, and a
          # multi-line output would break the shell command that consumes it.
          LIST=$(node scripts/indexnow-urls.mjs $CHANGED | xargs)
          echo "Submitting: ${LIST:-(nothing)}"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
        env:
          INDEXNOW_SUBMIT_ALL: ${{ inputs.submit_all }}

      # Keep the previous build's fingerprinted assets alongside the new ones.
      #
      # Next.js content-hashes CSS and JS filenames, and Hostinger's CDN caches
      # HTML for up to a year. After a deploy those two facts collide: a visitor
      # holding cached HTML requests the old hash, which a force-push had just
      # deleted, gets a 404, and sees a completely unstyled page.
      #
      # Retaining the old files costs a few hundred KB and makes stale HTML keep
      # working until it revalidates. -n never overwrites a file from this build.
      - name: Preserve the previous build's hashed assets
        run: |
          set -e
          git fetch --depth=1 origin deploy || true
          if ! git rev-parse --verify origin/deploy >/dev/null 2>&1; then
            echo "No existing deploy branch — nothing to carry over."
            exit 0
          fi

          rm -rf /tmp/prev && mkdir -p /tmp/prev
          git archive origin/deploy | tar -x -C /tmp/prev
          [ -d /tmp/prev/_next/static ] || { echo "Previous build had no static assets."; exit 0; }

          mkdir -p out/_next/static
          STATIC=out/_next/static
          PREV=/tmp/prev/_next/static

          # Anything the PREVIOUS deploy already carried over is two generations
          # old. Drop it, so retained assets stay bounded at two builds instead
          # of accumulating on every deploy forever.
          if [ -f "$PREV/.carried" ]; then
            while IFS= read -r f; do [ -n "$f" ] && rm -f "$PREV/$f"; done < "$PREV/.carried"
          fi
          rm -f "$PREV/.carried"

          # Snapshot this build, copy in the previous one without clobbering it,
          # then record exactly which files came from the older build.
          (cd "$STATIC" && find . -type f | sed 's|^\./||' | sort) > /tmp/this-build.txt
          cp -rn "$PREV/." "$STATIC/" 2>/dev/null || true
          (cd "$STATIC" && find . -type f | sed 's|^\./||' | sort) > /tmp/after.txt
          comm -13 /tmp/this-build.txt /tmp/after.txt > "$STATIC/.carried"

          echo "This build: $(wc -l < /tmp/this-build.txt) asset(s)"
          echo "Carried over: $(wc -l < "$STATIC/.carried") asset(s) from the previous build"

      - name: Publish out/ to the deploy branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} from main"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy

      # Tell IndexNow (Bing, Yandex, Seznam) what changed. The ping script waits
      # for Hostinger to pull the deploy branch before submitting, so Bing is
      # never pointed at the previous build. Never fail the deploy over this.
      - name: Notify IndexNow
        if: steps.urls.outputs.list != ''
        continue-on-error: true
        env:
          URLS: ${{ steps.urls.outputs.list }}
        run: node scripts/indexnow-ping.mjs $URLS
